<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos IoT</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        #data-list { margin-top: 1em; }
        .sensor-item { padding: 0.5em; border-bottom: 1px solid #ccc; }
        button { padding: 0.5em 1em; }
    </style>
</head>
<body>
    <h1>Datos de Sensores IoT</h1>
    <button onclick="loadData()">Cargar datos</button>
    <div id="data-list"></div>
    <script>
        async function loadData() {
            const dataList = document.getElementById('data-list');
            dataList.innerHTML = 'Cargando...';
            try {
                // Cambia la URL por la de tu backend
                const response = await fetch('https://iot-data-uun9.onrender.com/');
                const data = await response.json();
                dataList.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'sensor-item';
                    div.textContent = JSON.stringify(item);
                    dataList.appendChild(div);
                });
            } catch (error) {
                dataList.innerHTML = 'Error al cargar los datos';
            }
        }
    </script>
</body>
</html>
